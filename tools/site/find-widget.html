<div class="sc-find">
<style>
.sc-find{--acc:#b35a45;--ink:#1f1f1f;--soft:#f7f0ea}
.sc-find .sc-find-title{display:block;color:var(--ink)!important;font-size:20px!important;font-weight:800!important;line-height:1.25;margin:0 0 4px}
.sc-find .sc-find-sub{display:block;color:#7a6f68!important;font-size:14px!important;line-height:1.4;margin:0 0 14px}
.sc-find form{display:flex;align-items:center;background:var(--soft);border:1.5px solid #eadbd0;border-radius:999px;padding:4px 4px 4px 16px;margin:0;box-shadow:0 2px 10px rgba(80,50,30,.06)}
.sc-find form:focus-within{border-color:var(--acc);background:#fff}
.sc-find input[type=search]{flex:1;min-width:0;border:0!important;outline:0;background:transparent!important;box-shadow:none!important;padding:8px 6px!important;font-size:15px!important;color:var(--ink)}
.sc-find button{flex:0 0 40px;width:40px;height:40px;border:0!important;border-radius:50%!important;background:var(--acc)!important;color:#fff!important;display:flex;align-items:center;justify-content:center;cursor:pointer;padding:0!important}
.sc-find button:hover{background:#8f4434!important}
.sc-find .sc-find-label{display:block;color:var(--acc)!important;font-size:12px!important;font-weight:700!important;letter-spacing:.1em;text-transform:uppercase;margin:0 0 8px}
.sc-find .sc-chips{display:flex;flex-wrap:wrap;gap:8px}
.sc-find .sc-chips a{display:inline-block;padding:7px 14px;border:1.5px solid #eadbd0;border-radius:999px;background:#fff;color:var(--ink)!important;font-size:14px!important;font-weight:600;text-decoration:none!important;line-height:1.2;transition:all .2s}
.sc-find .sc-chips a:hover{border-color:var(--acc);background:var(--acc);color:#fff!important}
</style>
<form role="search" method="get" action="/"><label class="screen-reader-text" for="sc-find-s">Search patterns</label><input id="sc-find-s" type="search" name="s" placeholder="Dress, shorts, top&hellip;" /><button type="submit" aria-label="Search"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg></button></form>
</div>
<script>(function(){function a(){var s=document.getElementById('secondary');if(!s)return;s.style.marginTop='';if(!document.body.classList.contains('single-post')||window.innerWidth<1024)return;var art=document.querySelector('article.post');if(!art)return;var im=null,L=art.querySelectorAll('img');for(var i=0;i<L.length;i++){var r=L[i].getBoundingClientRect();if(r.height>150&&r.width>300){im=L[i];break;}}if(!im)return;var d=im.getBoundingClientRect().top-s.getBoundingClientRect().top;if(d>0&&d<500)s.style.marginTop=d+'px';}document.addEventListener('DOMContentLoaded',a);window.addEventListener('load',a);window.addEventListener('resize',a);})();</script>
